name: repet3d-projeto

services:
  db:
    image: postgres:17
    container_name: repet3d-postgres
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: gestaorepet
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: "no"

volumes:
  postgres_data: