spring.application.name=backend-gestao

server.port=8081

spring.web.error.include-stacktrace=never

app.cors.allowed-origins=http://localhost:3000,http://localhost:8080,http://localhost:8081,http://localhost:63342

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5440/gestaorepet
spring.datasource.username=postgres
spring.datasource.password=root

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true